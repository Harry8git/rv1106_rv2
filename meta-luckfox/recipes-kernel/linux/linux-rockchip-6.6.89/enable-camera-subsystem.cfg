# Enable the Rockchip camera capture stack (mis5001, sc3336, imx415 sensors +
# the CIF / ISP / CSI2-D-PHY pipeline) as loadable MODULES.
#
# Why the vendor never sets CONFIG_MEDIA_CAMERA_SUPPORT, and why we cannot just
# copy that:
#   The vendor SDK defconfig turns the camera stack on *implicitly* via the
#   EMBEDDED option (enabled in that defconfig).  On the 5.10 SDK kernel that
#   makes MEDIA_SUPPORT_FILTER default to n, which in turn makes
#   MEDIA_CAMERA_SUPPORT default to y and MEDIA_SUBDRV_AUTOSELECT default to n
#   - a clean camera build with no auto-selected extras.  The EMBEDDED option
#   was *removed* in kernel 6.6 (folded into EXPERT), so that defconfig line is
#   now a silent no-op: MEDIA_SUPPORT_FILTER falls back to y, the camera stack
#   disappears, and MEDIA_SUBDRV_AUTOSELECT flips on.  Bare-enabling the camera
#   support option therefore also switches the autoselect avalanche on and
#   links a built-in camera stack into the kernel image, which hung early
#   boot: the board went silent right after U-Boot's "Starting kernel ..."
#   (the console is the late-registering fiq-debugger and the kernel command
#   line has no earlycon, so an early-init hang produces no output at all).
#   (Note: avoid spelling out bare "CONFIG_<name>=<value>" assignments in these
#   comments - kernel-yocto's config merge auditor scans fragment files line-
#   by-line for that exact pattern and will misreport a commented-out mention
#   as an actual requested/invalid symbol in .kernel-meta/cfg/invalid.txt.)
#
# We deliberately do NOT turn MEDIA_SUPPORT_FILTER off: under
# KCONFIG_MODE = "alldefconfig" a "# CONFIG_x is not set" override of a
# default-y symbol does not stick, so disabling the filter would let the
# analog-TV / DVB / radio / tuner sub-domains default back on and drag in ~150
# unwanted drivers.  Instead we keep the filter at its default and assert only
# the positive symbols we need:
#
#   * MEDIA_SUPPORT=m       - the whole subsystem is a module, so nothing
#                             camera-related is linked into the kernel image;
#                             the kernel image stays byte-for-byte close to the
#                             known-good (camera-less) one and boots the same.
#   * MEDIA_CAMERA_SUPPORT  - un-hide the camera sensor drivers.
#   * MEDIA_PLATFORM_SUPPORT + V4L_PLATFORM_DRIVERS - required for the Rockchip
#                             CIF/ISP platform drivers to build (they are gated
#                             behind these, which are otherwise off while the
#                             filter is on).
#   * MEDIA_SUBDRV_AUTOSELECT off - no auto-selected sensor/tuner avalanche.
#
# Everything (videodev, videobuf2, CSI2 D-PHY, CIF, ISP, mis5001/sc3336/imx415)
# is built as a module and loaded on demand from user space.
CONFIG_MEDIA_SUPPORT=m
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_MEDIA_PLATFORM_SUPPORT=y
CONFIG_V4L_PLATFORM_DRIVERS=y
# CONFIG_MEDIA_SUBDRV_AUTOSELECT is not set
