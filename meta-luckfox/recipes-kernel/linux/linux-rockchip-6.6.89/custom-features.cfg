# --- Real-Time Scheduling & Low Latency for ArduPilot ---
CONFIG_PREEMPT=y
CONFIG_HZ_1000=y
# CONFIG_HZ_100 is not set
# CONFIG_HZ_250 is not set
CONFIG_HIGH_RES_TIMERS=y
# CONFIG_NO_HZ_IDLE is not set
CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y

# --- ArduPilot Hardware I/O (IMU, Baro, GPS, Telemetry) ---
CONFIG_SPI_SPIDEV=y
CONFIG_GPIO_CDEV=y
# CONFIG_GPIO_SYSFS is not set
CONFIG_SERIAL_8250_NR_UARTS=6
CONFIG_SERIAL_8250_RUNTIME_UARTS=6

# --- Host USB Serial Support (External USB GPS / Radios) ---
CONFIG_USB_ANNOUNCE_NEW_DEVICES=y
CONFIG_USB_ACM=y
CONFIG_USB_SERIAL=y
CONFIG_USB_SERIAL_GENERIC=y

# --- Sony IMX462 / IMX290 Camera Sensor & IR-Cut Filter ---
CONFIG_VIDEO_IMX290=y
CONFIG_VIDEO_RK_IRCUT=m

# --- Hardware Accelerators (RGA 2D & Rockchip NPU) ---
# CONFIG_ROCKCHIP_RGA is not set
CONFIG_ROCKCHIP_RGA2=y
# CONFIG_ROCKCHIP_RGA_ASYNC is not set
CONFIG_ROCKCHIP_RKNPU=y

# --- NEON Memory Copy Acceleration ---
CONFIG_UACCESS_WITH_MEMCPY=y
# --- CMA Memory Pool for V4L2 and MPP ---

CONFIG_CMA_SIZE_MBYTES=32
# CONFIG_CMA_INACTIVE is not set

# --- Rockchip DMA-BUF Heaps for MPP / V4L2 ---
CONFIG_DMABUF_HEAPS_ROCKCHIP=y
CONFIG_DMABUF_HEAPS_ROCKCHIP_CMA_HEAP=y
CONFIG_DMABUF_HEAPS_ROCKCHIP_SYSTEM_HEAP=y


CONFIG_V4L2_CCI_I2C=y
